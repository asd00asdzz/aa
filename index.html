<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>TikTok Manager</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { font-family: system-ui, "Noto Sans Thai", sans-serif; color: #172033; background: #f6f7fb; }
    main { height: 100%; display: flex; flex-direction: column; }
    .toolbar { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #e6e8ef; }
    .toolbar strong { font-size: 14px; }
    .toolbar a { color: #6d45e8; font-size: 13px; font-weight: 650; }
    iframe { display: block; flex: 1; width: 100%; min-height: 0; border: 0; background: #f6f7fb; }
    @media (max-width: 480px) { .toolbar { padding: 8px 12px; } .toolbar a { font-size: 12px; } }
  </style>
</head>
<body>
  <main>
    <header class="toolbar">
      <strong>TikTok Manager</strong>
      <a href="http://localhost:3000/" target="_blank" rel="noopener">เปิดแอปแยกหน้าต่าง</a>
    </header>
    <iframe src="http://localhost:3000/" title="เว็บจัดการบัญชี TikTok"></iframe>
  </main>
</body>
</html>
